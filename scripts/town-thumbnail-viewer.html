import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(128,128);renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.body.append(renderer.domElement);const scene=new THREE.Scene();scene.background=new THREE.Color(0xf7f2e9);scene.add(new THREE.HemisphereLight(0xffffff,0x9ca68d,2));const sun=new THREE.DirectionalLight(0xfff1d8,2.5);sun.position.set(5,9,7);scene.add(sun);const loader=new GLTFLoader(),camera=new THREE.OrthographicCamera(-1,1,1,-1,.01,10000);
window.renderThumbnail=async asset=>{const model=(await loader.loadAsync('/'+asset.file)).scene;scene.add(model);model.updateMatrixWorld(true);const box=new THREE.Box3().setFromObject(model),center=box.getCenter(new THREE.Vector3()),radius=Math.max(box.getSize(new THREE.Vector3()).length(),.01);camera.position.copy(center).add(new THREE.Vector3(1.3,1.05,1.6).normalize().multiplyScalar(radius*4));camera.lookAt(center);camera.updateMatrixWorld(true);const projected=new THREE.Box2();const point=new THREE.Vector3();model.traverse(o=>{if(!o.isMesh)return;const pos=o.geometry.attributes.position;for(let i=0;i<pos.count;i++){point.fromBufferAttribute(pos,i).applyMatrix4(o.matrixWorld).applyMatrix4(camera.matrixWorldInverse);projected.expandByPoint(new THREE.Vector2(point.x,point.y));}});const size=projected.getSize(new THREE.Vector2()),offset=projected.getCenter(new THREE.Vector2());camera.position.addScaledVector(new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,0),offset.x).addScaledVector(new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,1),offset.y);const half=Math.max(size.x,size.y)/2/.82;camera.left=-half;camera.right=half;camera.top=half;camera.bottom=-half;camera.updateProjectionMatrix();camera.updateMatrixWorld(true);renderer.render(scene,camera);const png=renderer.domElement.toDataURL('image/png'),stats={type:asset.type,width:128,height:128,projectedWidth:size.x/(2*half),projectedHeight:size.y/(2*half),triangles:renderer.info.render.triangles};scene.remove(model);const resources=new Set();model.traverse(o=>{if(o.geometry)resources.add(o.geometry);for(const m of Array.isArray(o.material)?o.material:o.material?[o.material]:[]){resources.add(m);for(const v of Object.values(m))if(v?.isTexture)resources.add(v);}});for(const r of resources){r.dispose();if(r.isTexture)r.image?.close?.();}return{png,stats};};window.thumbnailReady=true;
</script></body></html>
